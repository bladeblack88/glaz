
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>ЧЕ ТВ</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="ЧЕ ТВ">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#tv {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: #000;
}

header {
    height: 45px;
    min-height: 45px;
    background: #171717;
    color: white;
    display: flex;
    align-items: center;
    padding: 0 15px;
    font-size: 19px;
    font-weight: bold;
}

.logo {
    color: #ff3030;
    margin-right: 8px;
}

#player {
    flex: 1;
    position: relative;
    width: 100%;
    background: black;
}

iframe {
    width: 100%;
    height: 100%;
    border: 0;
    position: absolute;
    top: 0;
    left: 0;
}

footer {
    min-height: 55px;
    background: #171717;
    display: flex;
    justify-content: center;
    align-items: center;
}

button {
    background: #ed2424;
    border: none;
    border-radius: 7px;
    color: white;
    padding: 11px 22px;
    font-size: 16px;
    font-weight: bold;
}

@media (orientation: landscape) {
    header {
        display: none;
    }
}
</style>
</head>

<body>

<div id="tv">

<header>
    <span class="logo">ЧЕ!</span>
    ТЕЛЕВИЗОР
</header>

<div id="player">
    <iframe
        src="https://rutube.ru/play/embed/5bbff90167d1b1d88fda92376ec7a651"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen
        webkitallowfullscreen>
    </iframe>
</div>

<footer>
    <button onclick="window.location.href='https://rutube.ru/live/video/5bbff90167d1b1d88fda92376ec7a651/'">
        Открыть эфир на RUTUBE
    </button>
</footer>

</div>

</body>
</html>
