
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Россия — 16 веб-камер</title>

<style>
* { box-sizing:border-box; }

html, body {
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#101010;
  color:white;
  font-family:Arial,sans-serif;
}

header {
  height:42px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:4px 9px;
  background:#202020;
  font-size:14px;
}

header button {
  background:#167bd0;
  color:white;
  border:0;
  border-radius:5px;
  padding:7px 10px;
}

#grid {
  display:grid;
  grid-template-columns:repeat(4, minmax(0,1fr));
  grid-template-rows:repeat(4, minmax(0,1fr));
  gap:3px;
  height:calc(100vh - 42px);
  padding:3px;
}

.camera {
  position:relative;
  min-width:0;
  min-height:0;
  background:#222;
  border:1px solid #444;
  overflow:hidden;
}

.camera iframe {
  width:100%;
  height:100%;
  border:0;
  background:#111;
}

.name {
  position:absolute;
  top:2px;
  left:2px;
  z-index:2;
  background:rgba(0,0,0,.8);
  color:white;
  font-size:10px;
  padding:3px 4px;
  pointer-events:none;
}

.open {
  position:absolute;
  bottom:3px;
  right:3px;
  z-index:3;
  font-size:10px;
  color:white;
  background:#167bd0;
  padding:4px 6px;
  text-decoration:none;
  border-radius:3px;
}
</style>
</head>

<body>

<header>
  <span>РОССИЯ · ГОРОДСКИЕ КАМЕРЫ</span>
  <button onclick="location.reload()">Обновить</button>
</header>

<div id="grid"></div>

<script>
var cameras = [
  ["Волжский", "https://cam-world.ru/cams/perekrestok-druzhby-i-olomoutskoy-00031459"],
  ["Красноярск", "https://cam-world.ru/tv/tvk-6-krasnoyarsk-00031458"],
  ["Новосибирск — площадь Пименова", "https://cam-world.ru/cams/ploschad-pimenova-00031441"],
  ["Новосибирск — площадь Труда", "https://cam-world.ru/cams/ploschad-truda-3-00031440"],
  ["Новосибирск — площадь Ленина", "https://cam-world.ru/cams/ploschad-lenina-krasnyy-prospekt-00031439"],
  ["Каменск-Уральский", "https://cam-world.ru/cams/vid-na-kamensk-uralskiy-00031437"],
  ["Барнаул", "https://cam-world.ru/cams/barnaul-vid-na-naberezhnuyu-strelka-00031178"],
  ["Астрахань", "https://cam-world.ru/cams/astrahan-gorodskaya-kamera-kamera-9-00031165"],
  ["Челябинск", "https://cam-world.ru/transport/chelyabinsk-dorozhnaya-kamera-kamera-8-00031147"],
  ["Ставрополь", "https://cam-world.ru/cams/stavropol-gorodskoy-vid-kamera-9-00031139"],
  ["Киржач — Аленино", "https://cam-world.ru/cams/derevnya-alenino-kamera-6-kirzhachskiy-rayon-2-00031177"],
  ["Киржач — Автомир", "https://cam-world.ru/cams/avtosalon-avtomir-kirzhachskiy-rayon-00031176"],
  ["Киржач — Селиваново", "https://cam-world.ru/cams/derevnya-selivanovo-kirzhachskiy-rayon-00031169"],
  ["Великие Луки — площадка", "https://cam-world.ru/cams/velikie-luki-stsenicheskaya-ploschadka-velikie-luki-00031168"],
  ["Великие Луки — площадь Ленина", "https://cam-world.ru/cams/velikie-luki-ploschad-lenina-velikie-luki-00031167"],
  ["Великие Луки — Вечный огонь", "https://cam-world.ru/cams/velikie-luki-vechnyy-ogon-2-00031166"]
];

var grid = document.getElementById("grid");

cameras.forEach(function(camera) {
  var box = document.createElement("div");
  box.className = "camera";

  var label = document.createElement("div");
  label.className = "name";
  label.textContent = camera[0];

  var frame = document.createElement("iframe");
  frame.src = camera[1];
  frame.setAttribute("allow", "autoplay; fullscreen");
  frame.setAttribute("scrolling", "no");

  var link = document.createElement("a");
  link.className = "open";
  link.href = camera[1];
  link.target = "_blank";
  link.textContent = "Открыть";

  box.appendChild(frame);
  box.appendChild(label);
  box.appendChild(link);
  grid.appendChild(box);
});
</script>

</body>
</html>
