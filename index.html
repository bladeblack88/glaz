
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>IPTV 16 Channels</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#grid {
    width: 100vw;
    height: 100vh;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 2px;
    background: #222;
}

.channel {
    position: relative;
    overflow: hidden;
    background: #000;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}

.number {
    position: absolute;
    top: 3px;
    left: 4px;
    color: white;
    font: 12px Arial;
    background: rgba(0,0,0,0.65);
    padding: 3px 5px;
    z-index: 2;
    pointer-events: none;
}
</style>
</head>

<body>

<div id="grid"></div>

<script>

// ВСТАВЬТЕ СЮДА СВОИ IPTV M3U8 ССЫЛКИ

const channels = [
    "https://example.com/channel1.m3u8",
    "https://example.com/channel2.m3u8",
    "https://example.com/channel3.m3u8",
    "https://example.com/channel4.m3u8",
    "https://example.com/channel5.m3u8",
    "https://example.com/channel6.m3u8",
    "https://example.com/channel7.m3u8",
    "https://example.com/channel8.m3u8",
    "https://example.com/channel9.m3u8",
    "https://example.com/channel10.m3u8",
    "https://example.com/channel11.m3u8",
    "https://example.com/channel12.m3u8",
    "https://example.com/channel13.m3u8",
    "https://example.com/channel14.m3u8",
    "https://example.com/channel15.m3u8",
    "https://example.com/channel16.m3u8"
];

const grid = document.getElementById("grid");

channels.forEach((url, index) => {

    const box = document.createElement("div");
    box.className = "channel";

    const label = document.createElement("div");
    label.className = "number";
    label.textContent = "CH " + (index + 1);

    const video = document.createElement("video");

    video.src = url;
    video.autoplay = true;
    video.muted = true;
    video.defaultMuted = true;
    video.playsInline = true;
    video.setAttribute("webkit-playsinline", "");
    video.setAttribute("muted", "");
    video.preload = "none";

    video.addEventListener("error", () => {
        console.log("Ошибка канала " + (index + 1));
    });

    box.appendChild(video);
    box.appendChild(label);
    grid.appendChild(box);

    video.play().catch(error => {
        console.log("Не удалось запустить канал " + (index + 1));
    });

});

</script>

</body>
</html>
