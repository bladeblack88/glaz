<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Хитрые глаза">
<meta name="mobile-web-app-capable" content="yes">
<title>Хитрые глаза</title>
<style>
* { box-sizing:border-box; }
html,body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#10131a; color:#fff; font-family:Arial,sans-serif; -webkit-text-size-adjust:100%; }
#app { width:100%; height:100%; height:100vh; display:-webkit-flex; display:flex; -webkit-flex-direction:column; flex-direction:column; -webkit-align-items:center; align-items:center; -webkit-justify-content:center; justify-content:center; padding:12px; }
#eyes { width:100%; max-width:900px; height:58%; min-height:210px; display:block; overflow:visible; }
.eye { fill:#f7f7f2; stroke:#d9dce4; stroke-width:5; }
.iris { fill:#3877a8; }
.pupil { fill:#090b10; }
#eyes.red .iris { fill:#e00018; }
#eyes.red .pupil { fill:#250006; }
#status { font-size:17px; text-align:center; padding:12px 12px 4px; color:#e1e5ed; }
#hint { font-size:12px; color:#9299a8; text-align:center; padding:5px 18px; line-height:1.45; max-width:600px; }
#start { margin-top:14px; border:0; border-radius:12px; background:#2878c8; color:white; font-size:17px; padding:14px 22px; -webkit-appearance:none; appearance:none; }
#start:active { background:#175b9c; }
#camera { position:absolute; width:2px; height:2px; left:-20px; top:-20px; opacity:0.01; }
#motion { display:none; }
</style>
</head>
<body>
<div id="app">
<svg id="eyes" viewBox="0 0 800 390" role="img" aria-label="Хитрые большие движущиеся глаза">
 <defs>
  <clipPath id="leftClip"><ellipse cx="220" cy="205" rx="170" ry="125"/></clipPath>
  <clipPath id="rightClip"><ellipse cx="580" cy="205" rx="170" ry="125"/></clipPath>
  <linearGradient id="eyeWhite" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe6ed"/></linearGradient>
  <linearGradient id="browShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2b27"/><stop offset="1" stop-color="#17151a"/></linearGradient>
 </defs>
 <path d="M55 128 Q205 48 378 116 Q290 78 220 93 Q130 94 55 128Z" fill="url(#browShade)"/>
 <path d="M422 116 Q595 48 745 128 Q670 94 580 93 Q510 78 422 116Z" fill="url(#browShade)"/>
 <ellipse class="eye" cx="220" cy="205" rx="170" ry="125" fill="url(#eyeWhite)"/>
 <ellipse class="eye" cx="580" cy="205" rx="170" ry="125" fill="url(#eyeWhite)"/>
 <g id="leftEye" clip-path="url(#leftClip)">
  <circle class="iris" cx="220" cy="205" r="78"/><circle class="pupil" cx="220" cy="205" r="42"/>
  <circle cx="248" cy="173" r="17" fill="#fff"/><circle cx="193" cy="229" r="7" fill="#fff" opacity=".65"/>
 </g>
 <g id="rightEye" clip-path="url(#rightClip)">
  <circle class="iris" cx="580" cy="205" r="78"/><circle class="pupil" cx="580" cy="205" r="42"/>
  <circle cx="608" cy="173" r="17" fill="#fff"/><circle cx="553" cy="229" r="7" fill="#fff" opacity=".65"/>
 </g>
 <path d="M52 174 Q220 82 388 174 Q365 122 310 116 Q190 92 85 153Z" fill="#10131a" opacity=".88"/>
 <path d="M412 174 Q580 82 748 174 Q715 153 690 143 Q585 92 490 116 Q435 122 412 174Z" fill="#10131a" opacity=".88"/>
 <ellipse id="lidL" cx="220" cy="205" rx="171" ry="0" fill="#10131a"/>
 <ellipse id="lidR" cx="580" cy="205" rx="171" ry="0" fill="#10131a"/>
</svg>
<div id="status">Хитрый взгляд следит за движением</div>
<button id="start">Включить переднюю камеру</button>
<div id="hint">Нажмите кнопку и разрешите доступ к камере. Для работы камеры страницу нужно открыть по защищённому HTTPS-адресу.</div>
<video id="camera" autoplay playsinline webkit-playsinline muted></video>
<canvas id="motion" width="80" height="60"></canvas>
</div>
<script>
(function () {
 var left = document.getElementById('leftEye');
 var right = document.getElementById('rightEye');
 var lidL = document.getElementById('lidL');
 var lidR = document.getElementById('lidR');
 var eyes = document.getElementById('eyes');
 var status = document.getElementById('status');
 var hint = document.getElementById('hint');
 var start = document.getElementById('start');
 var video = document.getElementById('camera');
 var canvas = document.getElementById('motion');
 var ctx = canvas.getContext('2d');
 var previous = null, redUntil = 0, blinkUntil = 0, lastMotion = 0;
 var direction = 0, nextDirection = 0, lastShift = 0, running = false;
 var streamRef = null;

 function setGaze(x, y) {
  left.setAttribute('transform', 'translate(' + x + ' ' + y + ')');
  right.setAttribute('transform', 'translate(' + x + ' ' + y + ')');
 }
 function blink(duration) { blinkUntil = new Date().getTime() + (duration || 170); }

 function animate() {
  var now = new Date().getTime();
  if (now > lastShift + 1900) {
   nextDirection = Math.floor(Math.random() * 3) - 1;
   lastShift = now;
  }
  direction += (nextDirection - direction) * 0.045;
  setGaze(direction * 34, Math.sin(now / 1100) * 5);
  var lidHeight = now < blinkUntil ? 126 : 0;
  lidL.setAttribute('ry', lidHeight);
  lidR.setAttribute('ry', lidHeight);
  if (now > blinkUntil && Math.random() < 0.004) blink(170);
  eyes.setAttribute('class', now < redUntil ? 'red' : '');
  window.requestAnimationFrame(animate);
 }

 function checkMotion() {
  if (!running || video.readyState < 2) {
   window.setTimeout(checkMotion, 180);
   return;
  }
  try {
   ctx.drawImage(video, 0, 0, 80, 60);
   var data = ctx.getImageData(0, 0, 80, 60).data;
   var diff = 0, count = 0, i, a, b;
   if (previous) {
    for (i = 0; i < data.length; i += 16) {
     a = (data[i] + data[i+1] + data[i+2]) / 3;
     b = (previous[i] + previous[i+1] + previous[i+2]) / 3;
     if (Math.abs(a - b) > 35) count++;
     diff += Math.abs(a - b);
    }
    if (count > 20 || diff > 1900) {
     var now = new Date().getTime();
     if (now - lastMotion > 250) {
      redUntil = now + 1500;
      blinkUntil = now + 850;
      lastMotion = now;
      status.innerHTML = 'Движение обнаружено!';
     }
    } else if (new Date().getTime() > redUntil) {
     status.innerHTML = 'Камера активна — наблюдаю';
    }
   }
   previous = new Uint8ClampedArray(data);
  } catch (e) {}
  window.setTimeout(checkMotion, 120);
 }

 function cameraError(err) {
  running = false;
  status.innerHTML = 'Нет доступа к камере';
  hint.innerHTML = 'Разрешите Safari доступ к камере в настройках сайта и проверьте, что страница открыта через HTTPS. Если не помогло, перезагрузите страницу.';
  start.disabled = false;
  start.innerHTML = 'Попробовать ещё раз';
 }

 function cameraSuccess(stream) {
  streamRef = stream;
  if ('srcObject' in video) video.srcObject = stream;
  else if (window.URL && window.URL.createObjectURL) video.src = window.URL.createObjectURL(stream);
  video.muted = true;
  var playResult = video.play();
  if (playResult && playResult.then) {
   playResult.then(function () {
    running = true;
    previous = null;
    status.innerHTML = 'Камера активна — наблюдаю';
    hint.innerHTML = 'Когда камера заметит движение, глаза начнут часто мигать и станут красными.';
    start.style.display = 'none';
    checkMotion();
   }, cameraError);
  } else {
   running = true;
   status.innerHTML = 'Камера активна — наблюдаю';
   start.style.display = 'none';
   checkMotion();
  }
 }

 start.addEventListener('click', function () {
  start.disabled = true;
  status.innerHTML = 'Запрашиваю доступ к камере…';
  var md = navigator.mediaDevices;
  if (md && md.getUserMedia) {
   md.getUserMedia({ video: { facingMode: 'user' }, audio: false }).then(cameraSuccess, function () {
    md.getUserMedia({ video: true, audio: false }).then(cameraSuccess, cameraError);
   });
  } else {
   var legacy = navigator.getUserMedia || navigator.webkitGetUserMedia || navigator.mozGetUserMedia;
   if (legacy) {
    legacy.call(navigator, { video: true, audio: false }, cameraSuccess, cameraError);
   } else {
    start.disabled = false;
    status.innerHTML = 'Браузер не поддерживает доступ к камере';
    hint.innerHTML = 'Откройте страницу в Safari на iOS 12.5.8. Если это старое устройство, проверьте поддержку камеры и обновления браузера.';
   }
  }
 });
 window.addEventListener('pagehide', function () {
  running = false;
  if (streamRef && streamRef.getTracks) {
   var tracks = streamRef.getTracks();
   for (var i = 0; i < tracks.length; i++) tracks[i].stop();
  }
 });
 animate();
}());
</script>
</body>
</html>
