
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>IPTV Multiview</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
}

body {
  padding: 8px;
}

h2 {
  text-align: center;
  margin: 5px 0 10px;
  font-size: 20px;
}

.controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 8px;
}

button {
  background: #1685e5;
  border: 0;
  color: white;
  border-radius: 6px;
  padding: 12px 18px;
  font-size: 16px;
}

button:disabled {
  opacity: 0.5;
}

#status {
  text-align: center;
  font-size: 13px;
  color: #ccc;
  margin: 8px 0;
  min-height: 18px;
}

#grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-template-rows: repeat(4, minmax(0, 1fr));
  gap: 4px;
  width: 100%;
  height: calc(100vh - 105px);
}

.tile {
  background: #222;
  border: 1px solid #444;
  position: relative;
  overflow: hidden;
  min-width: 0;
  min-height: 0;
}

.tile video {
  width: 100%;
  height: 100%;
  object-fit: fill;
  background: black;
}

.tile span {
  position: absolute;
  top: 3px;
  left: 4px;
  z-index: 2;
  font-size: 10px;
  background: rgba(0,0,0,0.65);
  padding: 2px 4px;
}

</style>
</head>

<body>

<h2>IPTV MULTIVIEW</h2>

<div class="controls">
  <button id="start">СТАРТ СКАНИРОВАНИЯ</button>
  <button id="stop">СТОП</button>
</div>

<div id="status">Готов к проверке</div>

<div id="grid"></div>

<script>

/*
  ВАЖНО:
  Это пример списка адресов.
  Потоки не проверены и могут быть недоступны.
  Замени URL на свои рабочие IPTV HLS-ссылки (.m3u8).
*/

var channels = [
  {name: "Канал 1", url: "https://example.com/channel1.m3u8"},
  {name: "Канал 2", url: "https://example.com/channel2.m3u8"},
  {name: "Канал 3", url: "https://example.com/channel3.m3u8"},
  {name: "Канал 4", url: "https://example.com/channel4.m3u8"},
  {name: "Канал 5", url: "https://example.com/channel5.m3u8"},
  {name: "Канал 6", url: "https://example.com/channel6.m3u8"},
  {name: "Канал 7", url: "https://example.com/channel7.m3u8"},
  {name: "Канал 8", url: "https://example.com/channel8.m3u8"},
  {name: "Канал 9", url: "https://example.com/channel9.m3u8"},
  {name: "Канал 10", url: "https://example.com/channel10.m3u8"},
  {name: "Канал 11", url: "https://example.com/channel11.m3u8"},
  {name: "Канал 12", url: "https://example.com/channel12.m3u8"},
  {name: "Канал 13", url: "https://example.com/channel13.m3u8"},
  {name: "Канал 14", url: "https://example.com/channel14.m3u8"},
  {name: "Канал 15", url: "https://example.com/channel15.m3u8"},
  {name: "Канал 16", url: "https://example.com/channel16.m3u8"}
];

var grid = document.getElementById("grid");
var statusText = document.getElementById("status");
var startButton = document.getElementById("start");
var stopButton = document.getElementById("stop");

var currentIndex = 0;
var scanning = false;
var scanId = 0;

function setStatus(text) {
  statusText.textContent = text;
}

function stopScan() {
  scanning = false;
  scanId++;

  startButton.disabled = false;
  setStatus("Сканирование остановлено");
}

function scanNext(id) {

  if (!scanning || id !== scanId) {
    return;
  }

  if (currentIndex >= channels.length) {
    scanning = false;
    startButton.disabled = false;
    setStatus("Готово. Рабочих каналов: " +
      grid.children.length);
    return;
  }

  var channel = channels[currentIndex];
  currentIndex++;

  setStatus(
    "Проверка " + currentIndex + " из " +
    channels.length + ": " + channel.name
  );

  var tile = document.createElement("div");
  tile.className = "tile";

  var label = document.createElement("span");
  label.textContent = channel.name;

  var video = document.createElement("video");
  video.muted = true;
  video.autoplay = true;
  video.playsInline = true;
  video.setAttribute("muted", "");
  video.setAttribute("autoplay", "");
  video.setAttribute("playsinline", "");
  video.setAttribute("webkit-playsinline", "");

  tile.appendChild(video);
  tile.appendChild(label);
  grid.appendChild(tile);

  video.src = channel.url;

  var finished = false;

  function finish(success) {

    if (finished) return;
    finished = true;

    if (!success) {
      video.pause();
      video.removeAttribute("src");
      video.load();

      if (tile.parentNode) {
        tile.parentNode.removeChild(tile);
      }
    }

    setTimeout(function() {
      scanNext(id);
    }, 500);
  }

  video.onplaying = function() {
    finish(true);
  };

  video.onerror = function() {
    finish(false);
  };

  video.onabort = function() {
    finish(false);
  };

  try {
    var result = video.play();

    if (result && typeof result.catch === "function") {
      result.catch(function() {
        finish(false);
      });
    }
  } catch (e) {
    finish(false);
  }

  setTimeout(function() {
    finish(false);
  }, 12000);
}

function startScan() {

  scanId++;
  var id = scanId;

  currentIndex = 0;
  scanning = true;

  grid.innerHTML = "";

  startButton.disabled = true;

  setStatus("Начинаю сканирование...");

  scanNext(id);
}

startButton.addEventListener("click", startScan);
stopButton.addEventListener("click", stopScan);

</script>

</body>
</html>
