
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="ЧЕ">

<title>Телеканал ЧЕ</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}

#play {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 15px 30px;
    font-size: 20px;
    border: none;
    border-radius: 10px;
    background: white;
    color: black;
}
</style>
</head>

<body>

<video id="tv"
       autoplay
       muted
       playsinline
       webkit-playsinline
       controls>
</video>

<button id="play" onclick="startTV()">
    ▶ СМОТРЕТЬ ЧЕ
</button>

<script>
var stream =
"https://zabava-htlive.cdn.ngenix.net/hls/CH_PERETZ/variant.m3u8";

var tv = document.getElementById("tv");
var button = document.getElementById("play");

function startTV() {
    tv.src = stream;
    tv.muted = false;
    tv.load();

    var p = tv.play();

    if (p && p.catch) {
        p.catch(function() {
            button.style.display = "block";
        });
    }
}

function autoStart() {
    tv.src = stream;
    tv.muted = true;

    var p = tv.play();

    if (p && p.catch) {
        p.catch(function() {
            button.style.display = "block";
        });
    }
}

tv.addEventListener("playing", function() {
    button.style.display = "none";
});

tv.addEventListener("error", function() {
    button.style.display = "block";
});

autoStart();
</script>

</body>
</html>
