<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Глаза на камере">
<title>Глаза на камере</title>
<style>
* { box-sizing: border-box; }
html, body { width:100%; height:100%; margin:0; padding:0; overflow:hidden; background:#080a0e; font-family:Arial, sans-serif; color:#fff; }
#app { position:fixed; inset:0; width:100%; height:100%; height:100vh; background:#080a0e; overflow:hidden; }
#cameraView { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; -webkit-transform:scaleX(-1); transform:scaleX(-1); background:#080a0e; }
#shade { position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.28),transparent 32%,transparent 68%,rgba(0,0,0,.38)); pointer-events:none; }
#eyes { position:absolute; left:50%; top:47%; width:min(96vw, 920px); height:auto; max-height:66vh; -webkit-transform:translate(-50%,-50%); transform:translate(-50%,-50%); overflow:visible; pointer-events:none; }
.eyeWhite { fill:rgba(250,252,255,.96); stroke:#20242d; stroke-width:7; }
.iris { fill:#3a91bd; stroke:#123b55; stroke-width:5; }
.pupil { fill:#080b10; }
#eyes.alert .iris { fill:#e00022; stroke:#65000d; }
#eyes.alert .pupil { fill:#210006; }
.brow { fill:#211a19; stroke:#08090b; stroke-width:5; stroke-linejoin:round; }
.lid { fill:#17171d; }
#status { position:absolute; left:12px; right:12px; bottom:calc(18px + env(safe-area-inset-bottom)); text-align:center; font-size:14px; text-shadow:0 2px 5px #000; color:#fff; }
#startPanel { position:absolute; inset:0; display:-webkit-flex; display:flex; -webkit-align-items:center; align-items:center; -webkit-justify-content:center; justify-content:center; background:rgba(4,7,12,.78); padding:25px; text-align:center; }
#startBox { max-width:420px; }
h1 { font-size:26px; margin:0 0 12px; }
p { font-size:15px; line-height:1.45; color:#d5dbe5; }
button { border:0; border-radius:13px; background:#1679d2; color:white; font-size:18px; font-weight:bold; padding:15px 22px; margin-top:10px; -webkit-appearance:none; appearance:none; }
button:active { background:#0c5599; }
#retry { display:none; }
#motionCanvas { display:none; }
</style>
</head>
<body>
<div id="app">
  <video id="cameraView" autoplay muted playsinline webkit-playsinline></video>
  <div id="shade"></div>

  <!-- SVG-глаза накладываются поверх живого изображения передней камеры -->
  <svg id="eyes" viewBox="0 0 900 420" aria-label="Большие глаза">
    <defs>
      <clipPath id="clipL"><ellipse cx="250" cy="220" rx="205" ry="145"/></clipPath>
      <clipPath id="clipR"><ellipse cx="650" cy="220" rx="205" ry="145"/></clipPath>
      <radialGradient id="whiteGrad" cx="45%" cy="35%" r="70%">
        <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#cbd4df"/>
      </radialGradient>
    </defs>
    <path class="brow" d="M45 105 Q220 0 440 100 Q280 45 160 92 Q95 112 45 105Z"/>
    <path class="brow" d="M460 100 Q680 0 855 105 Q805 112 740 92 Q620 45 460 100Z"/>
    <ellipse class="eyeWhite" cx="250" cy="220" rx="205" ry="145" fill="url(#whiteGrad)"/>
    <ellipse class="eyeWhite" cx="650" cy="220" rx="205" ry="145" fill="url(#whiteGrad)"/>
    <g id="pupilL" clip-path="url(#clipL)">
      <circle class="iris" cx="250" cy="220" r="88"/>
      <circle class="pupil" cx="250" cy="220" r="47"/>
      <circle cx="281" cy="185" r="20" fill="#fff"/>
      <circle cx="222" cy="249" r="8" fill="#fff" opacity=".7"/>
    </g>
    <g id="pupilR" clip-path="url(#clipR)">
      <circle class="iris" cx="650" cy="220" r="88"/>
      <circle class="pupil" cx="650" cy="220" r="47"/>
      <circle cx="681" cy="185" r="20" fill="#fff"/>
      <circle cx="622" cy="249" r="8" fill="#fff" opacity=".7"/>
    </g>
    <path d="M45 200 Q250 55 455 200 Q430 110 355 95 Q190 65 80 157Z" fill="#17171d" opacity=".88"/>
    <path d="M445 200 Q650 55 855 200 Q820 157 710 95 Q545 65 470 110Z" fill="#17171d" opacity=".88"/>
    <ellipse id="lidL" class="lid" cx="250" cy="220" rx="206" ry="0"/>
    <ellipse id="lidR" class="lid" cx="650" cy="220" rx="206" ry="0"/>
  </svg>

  <div id="status">Камера ещё не включена</div>
  <div id="startPanel">
    <div id="startBox">
      <h1>Глаза на камере</h1>
      <p>Нажмите кнопку, чтобы включить переднюю камеру. Изображение с камеры появится на весь экран, а большие глаза будут поверх него.</p>
      <button id="start">Включить переднюю камеру</button>
      <p id="error" aria-live="polite"></p>
      <button id="retry">Попробовать снова</button>
    </div>
  </div>
  <canvas id="motionCanvas" width="80" height="60"></canvas>
</div>

<script>
(function () {
  var video = document.getElementById('cameraView');
  var startPanel = document.getElementById('startPanel');
  var startButton = document.getElementById('start');
  var retryButton = document.getElementById('retry');
  var errorText = document.getElementById('error');
  var status = document.getElementById('status');
  var eyes = document.getElementById('eyes');
  var pupilL = document.getElementById('pupilL');
  var pupilR = document.getElementById('pupilR');
  var lidL = document.getElementById('lidL');
  var lidR = document.getElementById('lidR');
  var canvas = document.getElementById('motionCanvas');
  var ctx = canvas.getContext('2d');

  var stream = null;
  var previousFrame = null;
  var motionActiveUntil = 0;
  var blinkUntil = 0;
  var lastMotionAt = 0;
  var gaze = 0;
  var targetGaze = 0;
  var lastGazeChange = 0;
  var detectorStarted = false;

  function now() { return new Date().getTime(); }

  function setGaze(x, y) {
    pupilL.setAttribute('transform', 'translate(' + x + ' ' + y + ')');
    pupilR.setAttribute('transform', 'translate(' + x + ' ' + y + ')');
  }

  function animate() {
    var t = now();
    if (t - lastGazeChange > 1700) {
      targetGaze = (Math.floor(Math.random() * 3) - 1) * 42;
      lastGazeChange = t;
    }
    gaze += (targetGaze - gaze) * 0.055;
    setGaze(gaze, Math.sin(t / 900) * 5);

    var closed = t < blinkUntil;
    var lidY = closed ? 145 : 0;
    lidL.setAttribute('ry', lidY);
    lidR.setAttribute('ry', lidY);

    if (t < motionActiveUntil) eyes.setAttribute('class', 'alert');
    else eyes.setAttribute('class', '');

    window.requestAnimationFrame(animate);
  }

  function detectMotion() {
    if (!stream || video.readyState < 2) {
      window.setTimeout(detectMotion, 200);
      return;
    }
    try {
      ctx.drawImage(video, 0, 0, 80, 60);
      var frame = ctx.getImageData(0, 0, 80, 60).data;
      if (previousFrame) {
        var changed = 0;
        var totalDiff = 0;
        for (var i = 0; i < frame.length; i += 16) {
          var current = (frame[i] + frame[i + 1] + frame[i + 2]) / 3;
          var old = (previousFrame[i] + previousFrame[i + 1] + previousFrame[i + 2]) / 3;
          var d = Math.abs(current - old);
          if (d > 32) changed++;
          totalDiff += d;
        }
        if ((changed > 19 || totalDiff > 1750) && now() - lastMotionAt > 350) {
          lastMotionAt = now();
          motionActiveUntil = lastMotionAt + 1600;
          blinkUntil = lastMotionAt + 950;
          status.innerHTML = 'Движение! Глаза заметили вас';
        } else if (now() > motionActiveUntil) {
          status.innerHTML = 'Камера включена — наблюдаю';
        }
      }
      previousFrame = new Uint8ClampedArray(frame);
    } catch (e) {
      /* Если браузер запрещает чтение кадров, видеопоток всё равно продолжает показываться. */
    }
    window.setTimeout(detectMotion, 140);
  }

  function showError(message) {
    errorText.innerHTML = message;
    retryButton.style.display = 'inline-block';
    startButton.style.display = 'none';
    status.innerHTML = 'Не удалось включить камеру';
  }

  function startCamera() {
    errorText.innerHTML = '';
    startButton.disabled = true;
    retryButton.style.display = 'none';
    startButton.innerHTML = 'Подключаю камеру…';

    var constraints = { audio: false, video: { facingMode: 'user' } };

    function success(mediaStream) {
      stream = mediaStream;
      try {
        if ('srcObject' in video) video.srcObject = mediaStream;
        else video.src = window.URL.createObjectURL(mediaStream);
      } catch (e) {
        video.src = window.URL.createObjectURL(mediaStream);
      }

      video.muted = true;
      var playPromise = video.play();

      function ready() {
        startPanel.style.display = 'none';
        status.innerHTML = 'Камера включена — наблюдаю';
        if (!detectorStarted) {
          detectorStarted = true;
          detectMotion();
        }
      }

      if (playPromise && typeof playPromise.then === 'function') {
        playPromise.then(ready, function () {
          showError('Поток камеры получен, но Safari не запустил видео. Нажмите «Попробовать снова».');
        });
      } else {
        ready();
      }
    }

    function failure(err) {
      var msg = 'Не получилось получить доступ к камере.<br>Проверьте разрешение Safari и откройте страницу по HTTPS.';
      if (err && err.name === 'NotAllowedError') msg = 'Доступ к камере запрещён. Разрешите камеру для этого сайта в настройках Safari и попробуйте снова.';
      if (err && err.name === 'NotFoundError') msg = 'Передняя камера не найдена.';
      showError(msg);
      startButton.disabled = false;
      startButton.innerHTML = 'Включить переднюю камеру';
    }

    var gum = navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
    if (gum) {
      gum.call(navigator.mediaDevices, constraints).then(success, function () {
        /* На старых версиях Safari facingMode может не поддерживаться — пробуем обычный запрос. */
        gum.call(navigator.mediaDevices, { video: true, audio: false }).then(success, failure);
      });
    } else {
      var oldGum = navigator.getUserMedia || navigator.webkitGetUserMedia || navigator.mozGetUserMedia;
      if (oldGum) oldGum.call(navigator, constraints, success, failure);
      else showError('Этот браузер не предоставляет доступ к камере. Откройте страницу в Safari на iOS 12.5.8 по HTTPS.');
    }
  }

  startButton.addEventListener('click', startCamera, false);
  retryButton.addEventListener('click', function () {
    startButton.style.display = 'inline-block';
    startButton.disabled = false;
    startCamera();
  }, false);

  window.addEventListener('pagehide', function () {
    if (stream && stream.getTracks) {
      var tracks = stream.getTracks();
      for (var i = 0; i < tracks.length; i++) tracks[i].stop();
    }
  }, false);

  animate();
}());
</script>
</body>
</html>
