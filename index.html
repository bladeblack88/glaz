
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="NGENIX TV">

<title>NGENIX TV</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

body {
    display: flex;
    flex-direction: column;
}

#player {
    flex: 1;
    min-height: 150px;
    background: black;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: black;
}

#channels {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    padding: 10px;
    max-height: 38vh;
    overflow-y: auto;
    background: #111;
}

.channel {
    min-height: 48px;
    border: 1px solid #555;
    border-radius: 8px;
    background: #292929;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

.channel.active {
    background: white;
    color: black;
}

#start {
    position: absolute;
    z-index: 5;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: rgba(0,0,0,.88);
    color: white;
    font-size: 22px;
}

#start[hidden] {
    display: none;
}

@media (orientation: landscape) {
    body { flex-direction: row; }

    #channels {
        width: 220px;
        max-height: 100%;
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div id="player">
    <video id="tv"
        autoplay
        playsinline
        webkit-playsinline
        preload="auto">
    </video>
</div>

<div id="channels"></div>

<button id="start" hidden>
    Нажмите для запуска эфира со звуком
</button>

<script>

var channels = [
["ЧЕ","https://zabava-htlive.cdn.ngenix.net/hls/CH_PERETZ/variant.m3u8"],
["СТС","https://zabava-htlive.cdn.ngenix.net/hls/CH_STS/variant.m3u8"],
["ТНТ","https://zabava-htlive.cdn.ngenix.net/hls/CH_TNT/variant.m3u8"],
["ТВ3","https://zabava-htlive.cdn.ngenix.net/hls/CH_TV3/variant.m3u8"],
["РЕН ТВ","https://zabava-htlive.cdn.ngenix.net/hls/CH_RENTV/variant.m3u8"],
["ТНТ4","https://zabava-htlive.cdn.ngenix.net/hls/CH_TNT4/variant.m3u8"],
["Пятница!","https://zabava-htlive.cdn.ngenix.net/hls/CH_PYATNIZZA/variant.m3u8"],
["СТС Love","https://zabava-htlive.cdn.ngenix.net/hls/CH_STSLOVE/variant.m3u8"],
["Первый канал","http://s18209.cdn.ngenix.net/hls/CH_R03_1TV/playlist.m3u8"],
["Россия 1","http://s18209.cdn.ngenix.net/hls/CH_R04_ROSSIA1/playlist.m3u8"],
["НТВ","https://zabava-htlive.cdn.ngenix.net/hls/CH_NTV/variant.m3u8"],
["Россия 24","http://s18209.cdn.ngenix.net/hls/CH_R01_ROSSIA24/playlist.m3u8"],
["ОТР","https://zabava-htlive.cdn.ngenix.net/hls/CH_OTR/variant.m3u8"],
["Звезда","http://s18209.cdn.ngenix.net/hls/CH_R03_ZVEZDA/playlist.m3u8"],
["Пятый канал","http://zabava-htlive.cdn.ngenix.net/hls/CH_5TV/variant.m3u8"],
["Россия К","http://s18209.cdn.ngenix.net/hls/CH_R02_ROSSIAK/playlist.m3u8"]
];

var tv = document.getElementById("tv");
var list = document.getElementById("channels");
var startButton = document.getElementById("start");

var currentChannel = 0;

function playChannel(index) {
    currentChannel = index;

    document.querySelectorAll(".channel").forEach(function(btn, i) {
        btn.classList.toggle("active", i === index);
    });

    tv.pause();
    tv.src = channels[index][1];
    tv.muted = false;
    tv.load();

    var p = tv.play();

    if (p && p.catch) {
        p.catch(function() {
            startButton.hidden = false;
        });
    }
}

channels.forEach(function(channel, index) {
    var button = document.createElement("button");

    button.className = "channel";
    button.textContent = channel[0];

    button.onclick = function() {
        playChannel(index);
    };

    list.appendChild(button);
});

startButton.onclick = function() {
    startButton.hidden = true;
    tv.muted = false;

    var p = tv.play();

    if (p && p.catch) {
        p.catch(function() {
            startButton.hidden = false;
        });
    }
};

tv.addEventListener("playing", function() {
    startButton.hidden = true;
});

tv.addEventListener("error", function() {
    startButton.hidden = false;
};

// Автоматический запуск ЧЕ со звуком
playChannel(0);

</script>
</body>
</html>
